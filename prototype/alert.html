<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Donate Alert Overlay (สำหรับ OBS)</title>
<style>
  html, body { margin: 0; height: 100%; background: rgba(0,0,0,0); overflow: hidden;
    font-family: 'Segoe UI', 'Noto Sans Thai', sans-serif; }
  #alert {
    position: fixed; top: 40%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: linear-gradient(135deg, rgba(255,110,199,.95), rgba(120,115,245,.95));
    padding: 28px 48px; border-radius: 20px; text-align: center;
    box-shadow: 0 0 60px rgba(255,110,199,.6), 0 20px 40px rgba(0,0,0,.5);
    border: 3px solid rgba(255,255,255,.5);
    opacity: 0; transition: transform .5s cubic-bezier(.2,1.6,.4,1), opacity .3s;
  }
  #alert.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  #alert .icon { font-size: 52px; animation: bounce 1s infinite alternate; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  #alert .name { font-size: 26px; font-weight: 800; color: #fff; margin-top: 8px;
    text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  #alert .amount { font-size: 40px; font-weight: 900; color: #ffe066;
    text-shadow: 0 2px 10px rgba(0,0,0,.5); margin-top: 2px; }
  #alert .msg { font-size: 17px; color: #fff; margin-top: 10px; max-width: 420px;
    text-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .confetti {
    position: fixed; font-size: 22px; pointer-events: none;
    animation: fall 3s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>
<div id="alert">
  <div class="icon">❤️</div>
  <div class="name" id="aName"></div>
  <div class="amount" id="aAmount"></div>
  <div class="msg" id="aMsg"></div>
</div>

<script>
// ---- เสียงสังเคราะห์ด้วย Web Audio API (ไม่ต้องมีไฟล์เสียง) ----
let audioCtx;
function ctx() { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }

function tone(freq, start, dur, type = 'sine', vol = .3) {
  const c = ctx(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, c.currentTime + start);
  g.gain.exponentialRampToValueAtTime(.001, c.currentTime + start + dur);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime + start); o.stop(c.currentTime + start + dur);
}

const sounds = {
  chime() { [880, 1108.7, 1318.5, 1760].forEach((f, i) => tone(f, i * .12, .8, 'sine', .25)); },
  coin() { tone(988, 0, .09, 'square', .2); tone(1319, .09, .5, 'square', .2); },
  fanfare() {
    [[523,0],[523,.15],[523,.3],[659,.45],[784,.65],[659,.85],[784,1.0],[1047,1.15]]
      .forEach(([f, t]) => tone(f, t, .35, 'sawtooth', .12));
  },
  tts(data) {
    const u = new SpeechSynthesisUtterance(
      `ขอบคุณ ${data.name} ที่โดเนต ${data.amount} บาท` +
      (data.message ? `. ${data.message}` : '')
    );
    u.lang = 'th-TH'; u.rate = 1;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }
};

// ---- ป็อบอัพ + คอนเฟตติ ----
const alertBox = document.getElementById('alert');
let hideTimer;

function showAlert(data) {
  clearTimeout(hideTimer);
  document.getElementById('aName').textContent = data.name;
  document.getElementById('aAmount').textContent = `฿${data.amount.toLocaleString()}`;
  document.getElementById('aMsg').textContent = data.message || '';
  alertBox.classList.add('show');
  confetti();

  (sounds[data.sound] || sounds.chime)(data);

  hideTimer = setTimeout(() => alertBox.classList.remove('show'), 6000);
}

function confetti() {
  const emojis = ['🎉', '💜', '✨', '🎊', '💰'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.random() * emojis.length | 0];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-30px';
    el.style.animationDelay = Math.random() * .8 + 's';
    el.style.animationDuration = 2.2 + Math.random() * 1.5 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }
}

// ---- รับ event จากหน้าโดเนต ----
new BroadcastChannel('donate-alerts').onmessage = e => showAlert(e.data);

// 🔴 TIP: กดปุ่ม "Test donation" ใน console (หรือเรียก testAlert()) เพื่อทดสอบใน OBS
window.testAlert = () => showAlert({
  name: 'คุณทดสอบ', amount: 100, message: 'นี่คือการทดสอบป็อบอัพ', sound: 'chime'
});
</script>
</body>
</html>
