<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donate Me ❤️ — สนับสนุนสตีมเมอร์</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Noto Sans Thai', sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1040 0%, #2d1b69 50%, #0f3460 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #fff;
  }
  .container { width: 100%; max-width: 480px; }
  .card {
    background: rgba(255,255,255,.07);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 20px; padding: 36px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .avatar {
    width: 90px; height: 90px; border-radius: 50%;
    background: linear-gradient(135deg, #ff6ec7, #7873f5);
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; margin: 0 auto 16px;
    box-shadow: 0 0 30px rgba(255,110,199,.5);
  }
  h1 { text-align: center; font-size: 26px; margin-bottom: 4px; }
  .subtitle { text-align: center; opacity: .7; margin-bottom: 28px; font-size: 14px; }
  label { display: block; font-size: 13px; opacity: .8; margin: 16px 0 6px; }
  input, select, textarea {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.25); color: #fff; font-size: 15px;
    outline: none; transition: border .2s;
  }
  input:focus, textarea:focus { border-color: #ff6ec7; }
  .amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  .amount-btn {
    padding: 10px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.25); color: #fff; cursor: pointer; font-weight: 600;
    transition: all .15s;
  }
  .amount-btn:hover { border-color: #ff6ec7; }
  .amount-btn.active {
    background: linear-gradient(135deg, #ff6ec7, #7873f5);
    border-color: transparent; box-shadow: 0 0 15px rgba(255,110,199,.5);
  }
  .sound-row { display: flex; align-items: center; gap: 10px; }
  .hint { font-size: 12px; opacity: .6; margin-top: 4px; }
  .submit-btn {
    width: 100%; margin-top: 28px; padding: 15px;
    border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #ff6ec7, #7873f5);
    color: #fff; font-size: 17px; font-weight: 700;
    transition: transform .15s, box-shadow .15s;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,110,199,.4); }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px);
    background: #22c55e; color: #fff; padding: 12px 24px; border-radius: 12px;
    font-weight: 600; transition: transform .3s; z-index: 99;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .obs-link {
    display: block; text-align: center; margin-top: 16px; font-size: 13px;
    color: #a5b4fc; text-decoration: none;
  }
  .obs-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="avatar">🎮</div>
    <h1>Donate Me</h1>
    <p class="subtitle">สนับสนุน Streamer เจ้าของช่อง เพื่อไฟล์ต่ออีกนานแล่น ๆ 💜</p>

    <label for="name">ชื่อ / ชื่อเล่น</label>
    <input id="name" placeholder="เช่น หมูทอดกรอบ" maxlength="30">

    <label>จำนวนเงิน (บาท)</label>
    <input id="amount" type="number" min="1" placeholder="เช่น 100">
    <div class="amounts">
      <button class="amount-btn" data-v="20">20</button>
      <button class="amount-btn" data-v="50">50</button>
      <button class="amount-btn" data-v="100">100</button>
      <button class="amount-btn" data-v="500">500</button>
    </div>

    <label for="message">ข้อความถึงสตีมเมอร์ (ไม่บังคับ)</label>
    <textarea id="message" rows="3" placeholder="สู้ ๆ นะ เก่งมากกก" maxlength="200"></textarea>

    <label>เสียงแจ้งเตือน</label>
    <div class="sound-row">
      <select id="sound">
        <option value="chime">🔔 เสียงกระดิ่ง</option>
        <option value="coin">🪙 เสียงเหรียญ</option>
        <option value="fanfare">🎺 เสียงโห่ร้อง</option>
        <option value="tts">🗣️ อ่านข้อความ (TTS)</option>
      </select>
    </div>

    <button class="submit-btn" id="donateBtn">❤️ โดเนตเลย!</button>
    <a class="obs-link" href="alert.html" target="_blank">🔊 เปิดหน้า Overlay สำหรับ OBS (ทดสอบเสียง/ป็อบอัพ)</a>
  </div>
</div>
<div class="toast" id="toast">โดเนตสำเร็จ! ขอบคุณมาก ๆ ❤️</div>

<script>
const channel = new BroadcastChannel('donate-alerts');
const amountInput = document.getElementById('amount');

document.querySelectorAll('.amount-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    amountInput.value = btn.dataset.v;
  });
});

document.getElementById('donateBtn').addEventListener('click', () => {
  const name = document.getElementById('name').value.trim();
  const amount = parseFloat(amountInput.value);
  const message = document.getElementById('message').value.trim();
  const sound = document.getElementById('sound').value;

  if (!name)  return alert('กรุณากรอกชื่อก่อนนะ');
  if (!amount || amount < 1) return alert('กรุณากรอกจำนวนเงินอย่างน้อย 1 บาท');

  channel.postMessage({ name, amount, message, sound, ts: Date.now() });

  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);

  document.getElementById('name').value = '';
  document.getElementById('message').value = '';
  amountInput.value = '';
});
</script>
</body>
</html>
